<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Esquema de la prueba de la coagulasa: tubo A con coágulo sólido (positivo) y tubo B con plasma líquido (negativo)">
  <rect width="560" height="340" fill="#FFF6E7"/>

  <!-- Tubo A: positivo -->
  <g transform="translate(120,40)">
    <path d="M -34 0 L -34 170 Q -34 200 -4 200 L 4 200 Q 34 200 34 170 L 34 0 Z"
          fill="#FFFFFF" stroke="#241E3D" stroke-width="3"/>
    <path d="M -30 90 L 30 90 L 30 168 Q 30 194 0 194 Q -30 194 -30 168 Z" fill="#F4E3B8"/>
    <path d="M -22 110 Q -6 96 6 112 Q 20 128 12 148 Q 2 168 -14 158 Q -28 148 -26 130 Q -25 118 -22 110 Z"
          fill="#C99A3E" stroke="#8a6a24" stroke-width="1.5"/>
    <line x1="-34" y1="0" x2="34" y2="0" stroke="#241E3D" stroke-width="3"/>
    <text x="0" y="-16" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="22" font-weight="700" fill="#241E3D">A</text>
  </g>
  <g transform="translate(120,270)" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif">
    <text y="0" font-size="14" font-weight="700" fill="#2FA97A">Coagulasa positiva</text>
    <text y="20" font-size="12.5" fill="#5B5480" font-style="italic">Staphylococcus aureus</text>
    <text y="38" font-size="11.5" fill="#8A8296">plasma coagulado (coágulo sólido)</text>
  </g>

  <!-- Tubo B: negativo -->
  <g transform="translate(300,40)">
    <path d="M -34 0 L -34 170 Q -34 200 -4 200 L 4 200 Q 34 200 34 170 L 34 0 Z"
          fill="#FFFFFF" stroke="#241E3D" stroke-width="3"/>
    <path d="M -30 90 L 30 90 L 30 168 Q 30 194 0 194 Q -30 194 -30 168 Z" fill="#F4E3B8"/>
    <line x1="-30" y1="92" x2="30" y2="92" stroke="#C99A3E" stroke-width="1.5" opacity="0.6"/>
    <line x1="-34" y1="0" x2="34" y2="0" stroke="#241E3D" stroke-width="3"/>
    <text x="0" y="-16" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="22" font-weight="700" fill="#241E3D">B</text>
  </g>
  <g transform="translate(300,270)" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif">
    <text y="0" font-size="14" font-weight="700" fill="#EF6351">Coagulasa negativa</text>
    <text y="20" font-size="12.5" fill="#5B5480" font-style="italic">Staphylococcus epidermidis</text>
    <text y="38" font-size="11.5" fill="#8A8296">plasma permanece líquido</text>
  </g>

  <text x="470" y="325" text-anchor="end" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="10" fill="#8A8296">esquema ilustrativo, no una fotografía real</text>
</svg>
